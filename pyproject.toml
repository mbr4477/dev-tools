[project]
name = "dev-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Matthew Russell", email = "mbr4477@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "jsonschema>=4.26.0",
    "openai>=3.8.0",
    "rich>=15.0.0",
]

[project.scripts]
run_agent = "dev_tools.agent:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "hatchet/impl-worker",
]
